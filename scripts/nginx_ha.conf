# scripts/nginx_ha.conf
# High Availability Nginx Load Balancer Configuration for OSI NOC Incident Analysis System

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    use epoll;
}

# 1. Ingestion Servers Load Balancing (Raw TCP Layer 4)
stream {
    upstream go_ingestion_servers_18800 {
        hash $remote_addr consistent;
        server ingestion_node1:18800 max_fails=3 fail_timeout=10s;
        server ingestion_node2:18800 max_fails=3 fail_timeout=10s;
    }

    upstream go_ingestion_servers_18802 {
        hash $remote_addr consistent;
        server ingestion_node1:18802 max_fails=3 fail_timeout=10s;
        server ingestion_node2:18802 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 18800;
        proxy_pass go_ingestion_servers_18800;
        proxy_timeout 10m;
        proxy_connect_timeout 3s;
    }

    server {
        listen 18802;
        proxy_pass go_ingestion_servers_18802;
        proxy_timeout 10m;
        proxy_connect_timeout 3s;
    }
}

# 2. HTTP/HTTPS Dashboard Portal Load Balancing (Layer 7)
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
                    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    upstream go_dashboard_servers {
        least_conn; # Route to server with fewest active connections
        server dashboard_node1:9999 max_fails=3 fail_timeout=5s;
        server dashboard_node2:9999 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name noc.company.com;
        return 301 https://$host$request_uri; # Redirect HTTP to HTTPS
    }

    server {
        listen 443 ssl http2;
        server_name noc.company.com;

        # SSL Certificates Configuration (Rotated dynamically)
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Client mTLS verification (Optional)
        # ssl_client_certificate /etc/nginx/certs/ca.crt;
        # ssl_verify_client on;

        # Proxy parameters
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location / {
            proxy_pass http://go_dashboard_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 90s;
        }

        # WebSocket support for realtime log stream
        location /ws/logs {
            proxy_pass http://go_dashboard_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s; # Persistent WebSocket connection
        }
    }
}
