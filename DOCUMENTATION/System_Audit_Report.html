## 1. Executive Summary

Ekosistem **AI-Driven Intelligent Incident Analysis (v4.7)** adalah platform pemantauan, analisis akar masalah (RCA), dan remediasi insiden berbasis agen cerdas (*intelligent agents*) yang dirancang untuk lingkungan kasir dan *store operations*. Sistem ini berhasil mengintegrasikan deteksi *endpoint* secara *real-time* dengan orkestrasi AI pusat, mekanisme persetujuan manusia (*human-in-the-loop*), serta tata kelola keputusan otomatis (*governance*).

### Penilaian Kematangan Operasional (Operational Maturity Level)
Sistem diklasifikasikan pada tingkat **Managed & Governed (Level 4/5)**. AI tidak diizinkan melakukan tindakan destruktif secara sepihak; seluruh tindakan perbaikan dengan risiko menengah hingga kritis wajib divalidasi oleh operator manusia melalui Telegram Bot Hook atau dialog persetujuan PyQt5 lokal pada mesin kasir. Infrastruktur dilengkapi kemampuan pemulihan mandiri (*self-healing*) dan mekanisme *fallback* ke aturan statis (*rule-based*) apabila layanan model bahasa (LLM) mengalami gangguan.

## 4. Database Schema Audit

Sistem menggunakan database relasional PostgreSQL di sisi server dan SQLite sebagai cache luring (*offline buffer*) di sisi PC Klien.

### A. Tabel Utama PostgreSQL (\`database_manager.py\`)
1.  **\`fleet_devices\`**: Menyimpan daftar mesin kasir/klien aktif.
    *   *Kolom Utama*: \`pc_name\` (PK), \`site_id\`, \`status\`, \`is_approved\`, \`hardware_info\` (JSONB), \`last_seen\`, \`config_version\`.
2.  **\`telemetry_logs\`** (dan tabel partisi bulanan seperti \`telemetry_logs_y2026m06\`): Menyimpan log telemetri performa kasir.
    *   *Kolom Utama*: \`log_id\` (Serial PK), \`device_name\`, \`metric_type\`, \`metric_value\`, \`timestamp\` (PK), \`metadata\` (JSONB), \`event_id\`, \`correlation_id\`, \`incident_ticket_id\`, \`tenant_id\`.
3.  **\`incidents\`**: Repositori tiket insiden yang terdeteksi.
    *   *Kolom Utama*: \`incident_id\` (PK), \`timestamp\`, \`device_name\`, \`layer\`, \`flag\`, \`raw_data\` (JSONB), \`rca_id\`, \`confidence\`, \`status_final\`, \`evidence\`, \`verified_status\`, \`incident_ticket_id\`, \`status\`, \`tenant_id\`, \`pipeline_version\`, \`site_name\`, \`updated_at\`, \`closed_at\`, \`rag_status\`.
4.  **\`ai_reflection_logs\`**: Log evaluasi hipotesis keputusan AI.
    *   *Kolom Utama*: \`id\` (PK), \`incident_id\` (FK \`incidents\`), \`stage_version\`, \`first_hypothesis\`, \`second_hypothesis\`, \`final_decision\`, \`confidence_score\`, \`ai_models_used\`, \`decision_time_ms\`.
5.  **\`fleet_evidence\`**: Penyimpanan tanda bukti log/telemetri mentah pendukung insiden.
    *   *Kolom Utama*: \`evidence_id\` (PK), \`incident_id\` (FK \`incidents\`), \`evidence_type\`, \`s3_path\`, \`timestamp\`.
6.  **\`ai_approval_logs\`**: Log persetujuan/penolakan tindakan remediator oleh operator manusia.
    *   *Kolom Utama*: \`id\` (PK), \`incident_id\` (FK \`incidents\`), \`risk_level\`, \`action_name\`, \`approved_by\`, \`approved_role\`, \`approved_at\`, \`approval_expiry\`, \`approval_status\`.
7.  **\`ai_blast_radius_logs\`**: Hasil simulasi dan estimasi dampak gangguan.
    *   *Kolom Utama*: \`id\` (PK), \`incident_id\` (FK \`incidents\`), \`impacted_sites\`, \`impacted_pcs\`, \`impacted_printers\`, \`impact_level\`.
8.  **\`immutable_audit_log\`**: Log audit yang bersifat tidak dapat diubah menggunakan hash chaining.
    *   *Kolom Utama*: \`log_id\` (PK), \`timestamp\`, \`action_type\`, \`actor\`, \`target\`, \`payload\` (JSONB), \`prev_hash\`, \`hash_signature\`.
9.  **\`ai_supervisor_audit\`**: Log audit keputusan orkestrator supervisor.
    *   *Kolom Utama*: \`id\` (PK), \`timestamp\`, \`health_score\`, \`status\`, \`failed_components\`, \`root_cause\`, \`confidence\`, \`recommendation\`.
10. **\`dlq_hybrid\` & \`dlq_poison\`**: Penampung paket telemetri rusak/gagal proses.
    *   *Kolom Utama*: \`dlq_id\` (PK), \`payload\`, \`reason\`, \`timestamp\`, \`redis_synced\`, \`retry_count\`, \`last_attempt\`, \`status\`.
11. **\`knowledge_vectors\`**: Vektor pencarian semantik basis pengetahuan.
    *   *Kolom Utama*: \`id\` (PK), \`domain\`, \`title\`, \`content\`, \`vector_blob\`, \`symptoms\`, \`root_cause\`, \`resolution\`.
12. **\`golden_solutions\` & \`golden_resolutions\`**: Repositori SOP dan perbaikan yang terbukti efektif.

##### 1. Alur Ingesti & Validasi Telemetri (Ingestion & Validation Flow)
Diagram ini menggambarkan perjalanan data telemetri mentah dari sensor di PC Kasir hingga divalidasi dan dikelompokkan ke dalam antrean terpisah berdasarkan kategori untuk mencegah bottleneck:

    GW -->|2. Check Signature & Timestamp| SEC{Validasi Keamanan & Replay Attack}:::gw
    SEC -->|Gagal: Deviasi > 300s / HMAC invalid| Reject[Tolak Payload / Log Security Alert]:::gw
    SEC -->|Sukses: Schema & Integritas OK| Process[Lazy Process Worker Pool]:::gw
    Process -->|3. JSON Parsing & Normalization| Demux{Queue Router / Backpressure}:::queue

    Q_Evt -->|Event Worker Pool| DB_W_Evt[Write Single Event & Update Device Status]:::db

    DB_W_Log --> Postgres
    DB_W_Evt --> Postgres
    DB_W_Evt -->|Update Status| Redis[(Redis Device Status Registry)]:::db

##### 3. Alur Persetujuan & Eksekusi Remedi (HITL Approval & Execution Flow)
Diagram ini menguraikan interaksi antara operator manusia (HITL) melalui dasbor NOC atau Telegram untuk menyetujui rekomendasi solusi dan mengirimkan perintah eksekusi ke agen klien kasir:

\`\`\`mermaid
sequenceDiagram
    autonumber

## 6. Audit Per Folder (01 - 09, Lewati 07, Tambahkan 15) & Komponen Inti

### Folder \`01_CORE_SERVER\`
*   **Fungsi Utama**: Otak pusat pengolahan telemetri, RCA, dan persistensi database server.
*   **Berkas Kritis**:
    *   \`ingestion_server.py\`: Mengatur penerimaan soket multi-port (8800, 8802, 19999). Dilengkapi proteksi *rate-limiting* (60 request/menit per IP) dan pengarah otomatis ke Dead Letter Queue (DLQ) untuk paket korup.
    *   \`database_manager.py\`: Mengelola koneksi pool ThreadedConnectionPool (min 5, max 50). Dilengkapi fitur *auto-recovery reset* jika transaksi database terputus/aborted di tengah jalan.
    *   \`orchestrator.py\`: Mesin RCA utama yang memicu alur diagnosa.
    *   \`system_auditor.py\`: Daemon pengawas kesehatan service background PostgreSQL, Redis, dan sirkulasi log secara berkala.
    *   \`nats_failover_manager.py\`: Mengelola koneksi client dan subscription asinkron ke broker failover NATS JetStream di Windows.
*   **Rekomendasi / Temuan**: Bebas dari syntax error. Kinerja pool connection PostgreSQL sangat tangguh berkat optimalisasi penanganan status transaksi \`IDLE\`.

## 8. Security Audit

Keamanan ekosistem dirancang menggunakan pendekatan **Zero-Trust Network Architecture**:

> [!IMPORTANT]
> 1. **Otentikasi HMAC-SHA256**: Agen kasir klien wajib menandatangani berkas telemetri menggunakan kunci HMAC bersama (\`security.key\`). Server Ingestion menolak paket jika selisih waktu server (*clock drift*) dengan pengirim melebihi 5 menit (mencegah *replay attacks*).
> 2. **Whitelist HTTP Relay**: Endpoint notifikasi \`/relay/telegram/send\` pada dashboard portal di-whitelist dari Basic Auth agar client tidak perlu menyimpan kredensial admin dashboard. Namun, keamanan tetap terjamin karena request wajib memiliki header \`X-Signature\` HMAC-SHA256 yang divalidasi oleh \`secure_relay_api.py\`.
> 3. **Command Sanitization**: Fungsi \`ai_sandbox.py\` memblokir perintah berisiko tinggi (seperti \`rmdir /s\`, \`format\`, \`del /f\`, atau penulisan registry sistem di luar wewenang) sebelum dikirimkan ke mesin kasir.

## 18. Evidence Graph & Penelusuran Hubungan AI (Baru Diterapkan)

Untuk mengatasi keterbatasan bukti log linier/biasa, kami telah mengimplementasikan **Evidence Graph (Graf Ketergantungan Hubungan)** pada sisi server analitik. AI kini mendeteksi akar masalah insiden dengan melakukan penelusuran relasi dependensi perangkat alih-alih melakukan pencarian teks log biasa.

### A. Struktur Graf Bukti Terkini (Evidence Graph)
Setiap anomali telemetri yang ditangkap oleh Ingestion Server dikompilasi oleh [evidence_collector.py](file:///d:/AI-AGEN%20DRIVEN%20INTELLIGENT%20INCIDENT%20ANALIS/01_CORE_SERVER/evidence_collector.py) menjadi graf terstruktur Node-Edge:
*   **Nodes**: Merepresentasikan entitas sistem operasional kasir:
    *   \`Host PC\`: Perangkat fisik kasir (misal: \`PC-FNBCBD02\`).
    *   \`Peripherals\`: Perangkat eksternal pendukung (misal: \`Printer-02\`).
    *   \`Network Switch\`: Node jaringan upstream (misal: \`Switch-01\`).
    *   \`Hardware Ports\`: Gerbang fisik koneksi (misal: \`USB-Port-3\`).
    *   \`Software Patch\`: Status pembaruan sistem operasi (misal: \`Windows-Update-KB5039212\`).
    *   \`Application\`: Aplikasi operasional utama (misal: \`POS-Application\`).
*   **Edges (Relations)**: Menghubungkan relasi antar node (misal: \`Printer-02\` ──► \`plugged_into\` ──► \`USB-Port-3\` ──► \`mounted_on\` ──► \`Host PC\`).

### B. Algoritma Penelusuran Relasi AI (RCA Tracing)
Di dalam [honest_agent_core.py](file:///d:/AI-AGEN%20DRIVEN%20INTELLIGENT%20INCIDENT%20ANALIS/01_CORE_SERVER/honest_agent_core.py) pada metode \`diagnose_advanced()\`, algoritma penelusuran graf otonom akan:
1.  Mengidentifikasi seluruh Node yang berstatus tidak sehat (\`status != 'ONLINE'\`).
2.  Menelusuri jalur ketergantungan dari hilir ke hulu menggunakan rekursi keterhubungan Edge.
3.  Mengisolasi akar masalah (*Root Cause*) pada node induk teratas yang bermasalah.

### C. Hasil Pengujian Tiga Skenario Kasus (Verified)
Pengujian dan validasi penuh dijalankan melalui skrip [test_evidence_graph.py](file:///d:/AI-AGEN%20DRIVEN%20INTELLIGENT%20INCIDENT%20ANALIS/scratch/test_evidence_graph.py) dengan hasil sebagai berikut:

## 19. Kalibrasi Confidence Otonom (Autonomous Confidence Calibration)

Untuk menghindari kasus di mana AI bertindak "terlalu percaya diri" (*overconfident*) pada diagnosis yang salah, kami telah menerapkan sistem kalibrasi otonom terintegrasi berbasis PostgreSQL.

### A. Alur Umpan Balik Kalibrasi (Calibration Feedback Loop)
Setiap kali insiden ditutup/direspon oleh operator melalui antarmuka dasbor \`/api/acknowledge_incident\`:
1.  **Jika Hasil Nyata Gagal (UNSOLVED)**:
    *   Sistem mencatat status penalti pada tabel \`ai_confidence_calibration\` untuk root cause yang bermasalah.
    *   Penalti ditambahkan sebesar **+15** per kegagalan (maksimal cap 100).
    *   Jumlah kegagalan berturut-turut (*consecutive failures*) ditambah 1.
2.  **Jika Hasil Nyata Sukses (SOLVED)**:
    *   Sistem mengurangi penalti sebesar **-5** secara bertahap (minimal 0).
    *   Jumlah kegagalan berturut-turut di-reset kembali ke 0.

### B. Rumus Penyesuaian Skor Kepercayaan AI
Saat melakukan diagnosis berikutnya, method \`_get_calibrated_confidence()\` pada \`honest_agent_core.py\` secara otomatis melakukan kueri penalti ke database:
\$\$\\text{Calibrated Confidence} = \\max\\left(0, \\text{Original Confidence} - \\text{Penalty}\\right)\$\$
Hal ini secara dinamis menurunkan confidence maksimum untuk pola rujukan kegagalan yang sama pada diagnosis berikutnya (misalnya: 98% ──► 83% jika pernah gagal sekali, atau 98% ──► 68% jika gagal dua kali berturut-turut), dan secara bertahap memulihkannya kembali ke nilai awal seiring dengan keberhasilan diagnosis.

## 20. Audit Fungsionalitas Analisis 5 Mengapa (5 Whys Analysis Audit)

Fungsionalitas **5 Whys Analysis** (Analisis 5 Mengapa) telah diaudit secara teknis dan diverifikasi berfungsi penuh pada seluruh pipeline mesin kognitif AI.

### A. Mekanisme Kerja 5 Whys di Sistem
1. **Penyimpanan Database Pengetahuan Lokal (\`local_knowledge_base.json\`)**:
   * Sebanyak **52 dari 53 entri** aturan pengetahuan lokal (SOP & riwayat insiden) telah terisi secara lengkap dengan array terstruktur \`"5_whys_analysis"\`. Setiap entri memetakan hubungan kausalitas dari tingkat gejala (WHY 1) hingga akar masalah terdalam (WHY 5).
2. **Pencarian & Pencocokan Lokal (Local KB Match)**:
   * Ketika kueri dari telemetri perangkat masuk dan berhasil dicocokkan dengan basis pengetahuan lokal (dengan skor confidence awal \$\\ge 0.90\$), sistem secara instan menarik dan menyajikan rantai 5 Whys yang tersimpan.
3. **Mekanisme Fallback Otonom (Cloud Outage Mitigation)**:
   * Jika tidak ada kecocokan di basis pengetahuan lokal dan layanan LLM Cloud (seperti DeepSeek atau Gemini) mengalami kegagalan (misalnya karena masalah saldo/balance, koneksi terputus, atau pembatasan IP), mesin refleksi internal (\`_perform_internal_reflection\` pada [multi_ai_learner.py](file:///d:/AI-AGEN%20DRIVEN%20INTELLIGENT%20INCIDENT%20ANALIS/01_CORE_SERVER/multi_ai_learner.py)) akan mengintersepsi secara otomatis dan memberikan rantai kognitif dasar: \`["Pola telemetri divalidasi oleh mesin kognitif internal."]\`.
4. **Pembelajaran Berkelanjutan (Continuous Learning)**:
   * Saat operator menyetujui diagnosa melalui loop persetujuan manusia (\`is_human_verified=True\`), hasil analisis 5 Whys yang baru dihasilkan akan disimpan secara permanen ke database RAG PostgreSQL dan berkas pembelajaran kontinu.

## 21. AI Cognitive Thinking Loop (Observe-Think-Research-Challenge-Verify-Conclude)

Untuk mengatasi keterbatasan diagnosis linier (langsung mengambil keputusan dari aturan statis), kami telah mengimplementasikan **AI Cognitive Thinking Loop (Alur Berpikir Kognitif)** ke dalam mesin utama [honest_agent_core.py](file:///d:/AI-AGEN%20DRIVEN%20INTELLIGENT%20INCIDENT%20ANALIS/01_CORE_SERVER/honest_agent_core.py). AI kini melakukan penalaran mandiri secara otonom sebelum menyimpulkan akar masalah.

### A. Tahapan Alur Berpikir Kognitif AI
Setiap analisis insiden dievaluasi melalui 6 langkah kognitif terstruktur:
1. **Observe (Mengamati)**: Mengumpulkan data telemetri, gejala fisik, link-state, dan mengidentifikasi nilai anomali awal.
2. **Think (Memikirkan)**: Memformulasikan beberapa hipotesis/teori penyebab gangguan secara bersamaan (misal: isu hardware vs software vs port).
3. **Research (Meneliti)**: Melakukan investigasi mendalam, memeriksa korelasi silang, status port, utilisasi resource, atau kueri graf hubungan topologi hulu-hilir.
4. **Challenge Hypothesis (Menguji Hipotesis)**: Mencoba mendebat atau mendisrupsi masing-masing hipotesis dengan mencari bukti-bukti kontradiktif (counter-evidence) atau pembuktian terbalik.
5. **Verify (Memverifikasi)**: Menguji hipotesis tersisa yang terkuat dengan mencocokkan logika konsistensi data telemetri dan status dependensi hulu.
6. **Conclude (Menyimpulkan)**: Menarik kesimpulan akhir root cause, menghitung level confidence secara jujur, dan merumuskan saran tindakan perbaikan.

## 24. Implementasi Serendipity Engine (Mesin Penemuan & Evolusi Pengetahuan Otonom)

Kami telah sukses mengimplementasikan, menguji, dan memverifikasi secara penuh **Serendipity Engine (v1.0.0)** di dalam folder [**\`07_SERENDIPITY_ENGINE/\`**](file:///d:/AI-AGEN%20DRIVEN%20INTELLIGENT%20INCIDENT%20ANALIS/07_SERENDIPITY_ENGINE). Komponen ini bertindak sebagai mesin analisis otonom tingkat lanjut yang melakukan scanning anomali, penambangan pola, korelasi lag waktu, perhitungan dampak ekonomi, identifikasi novelty, serta evolusi basis pengetahuan.

### A. Struktur Kode & Modul Serendipity Engine
1.  **\`anomaly_discovery.py\`**: Pemindai anomali telemetri secara *unsupervised* menggunakan metode statistik Z-Score (\$|Z| > 3.0\$) dan Interquartile Range (IQR) dengan multiplier \$1.5\$.
2.  **\`pattern_mining.py\`**: Pengelompokan anomali ke dalam jendela transaksi (default 5 menit) dan penambangan aturan asosiasi berulang (\$X \\to Y\$) berdasarkan minimum *support* dan *confidence*.
3.  **\`correlation_engine.py\`**: Perhitungan koefisien korelasi Pearson dan *time-lagged cross-correlation* lintas-node di satu lokasi untuk mengidentifikasi efek kaskade.
4.  **\`incident_genome.py\`**: Pemetaan tanda unik/DNA insiden berdasarkan hash SHA-256 (\`device_name + layer + metric_types + severity\`) dan pengukuran kemiripan Jaccard.
5.  **\`time_series_discovery.py\`**: Agregasi telemetri per jam dan per hari dalam seminggu untuk menemukan profil musiman dan jam puncak kegagalan sistem.
6.  **\`root_cause_graph.py\`**: Konstruksi graf propagasi insiden (DAG) berbasis \`networkx\` untuk mengisolasi simpul akar penyebab (in-degree = 0).
7.  **\`novelty_detector.py\`**: Pengukuran kemiripan kosinus berbasis frekuensi kata (*token Counter*) antara gejala insiden baru dengan basis pengetahuan lokal/PostgreSQL. Jika skor similarity \$< 0.50\$, insiden ditandai \`"HIGH_NOVELTY"\`.
8.  **\`economic_impact_engine.py\`**: Kalkulator perkiraan kerugian finansial (Rp) berdasarkan durasi downtime, tipe perangkat (POS Kasir = Rp 50.000/mnt, Router = Rp 75.000/mnt, dst), dan status pemblokiran transaksi.
9.  **\`hypothesis_generator.py\`**: Menerjemahkan genome insiden, DAG root cause, dan dampak ekonomi menjadi hipotesis terstruktur bagi teknisi SRE.
10. **\`autonomous_researcher.py\`**: Orchestrator utama yang menjalankan seluruh rangkaian analisis dan secara otomatis menulis proposal SOP baru ke PostgreSQL \`ai_approval_logs\` jika mendeteksi insiden baru yang bersifat *novel*.

12. **\`06_autonomous_research/daemon_scheduler.py\` & \`scheduler_config.yaml\`**: Daemon background berbasis \`BackgroundScheduler\` dari \`apscheduler\` yang mengontrol eksekusi otomatis scan berkala dan decay memori setiap 24 jam.

### B. Resolusi Kerentanan Keamanan Enkripsi Kunci (SPOF Kunci Enkripsi)
*   *Temuan*: \`SecurityManager\` sebelumnya menerapkan prinsip *fail-open* di mana jika terjadi kesalahan dekripsi (misal file kunci \`.key\` utama dan cadangan hilang), sistem akan membuat kunci baru secara acak. Hal ini menyebabkan string kredensial PostgreSQL yang tersimpan di [config.py](file:///d:/AI-AGEN%20DRIVEN%20INTELLIGENT%20INCIDENT%20ANALIS/01_CORE_SERVER/config.py) gagal didekripsi (Fernet key mismatch) dan mengembalikan string ciphertext mentah ke adapter database, memicu kegagalan database total saat dijalankan.
*   *Perbaikan*:
    1.  **Marker Inisialisasi (\`.initialized\`)**: Ditambahkan penanda instalasi. Jika marker ada tetapi kunci hilang, sistem menolak membuat kunci baru dan langsung berhenti berjalan (*fail-fast*) dengan melempar \`CatastrophicKeyLossError\` serta menampilkan petunjuk pemulihan.
    2.  **Verifikasi Sidik Jari Kunci (\`.key_fingerprint\`)**: Menyimpan sidik jari SHA-256 kunci untuk mendeteksi perubahan atau manipulasi kunci secara dini sebelum proses dekripsi dijalankan.
    3.  **Fail-Fast Decryption**: Mendeteksi pola data terenkripsi (Fernet prefix \`gAAAAA\`). Jika proses dekripsi data terenkripsi gagal, sistem segera melempar \`DecryptionError\` secara transparan untuk membedakan masalah enkripsi dari masalah otentikasi database.
    4.  **Windows Hidden Attribute Fix**: Fungsi penyimpanan secara dinamis mematikan atribut tersembunyi (\`attrib -h\`) sebelum menulis kunci baru untuk mencegah \`PermissionError [Errno 13]\`, dan mengaktifkannya kembali (\`attrib +h\`) setelah penulisan selesai.

### C. Pembersihan Telemetri Kasir Luring (Retention Cache Cleanup)
*   *Temuan*: Jika perangkat kasir mengalami offline jaringan berkepanjangan, data telemetri yang gagal dikirim akan terus menumpuk di file JSON lokal dan SQLite database (\`telemetry_cache\`), memicu kehabisan memori penyimpanan disk kasir.

## 29. Optimasi Pipeline Klasifikasi Telemetri Ingestion Paralel (Tingkat Enterprise - STATUS: FIXED)

*   **Temuan**: Sebelumnya, seluruh data telemetri mentah (metrik numerik, log syslog teks, dan event status perangkat) dikirimkan ke dalam satu antrean tunggal \`db_queue\` yang diproses secara berurutan (*sequential*) oleh satu worker thread \`db_writer_worker\`. Hal ini menimbulkan bottleneck kinerja yang parah (throughput rendah), risiko *single point of failure* (SPOF), latensi tinggi saat menerima beban telemetri volume besar dari ratusan PC kasir klien, serta ketiadaan proteksi *backpressure* (kebocoran memori).
*   **Perbaikan**: Kami telah menerapkan arsitektur pemrosesan paralel terisolasi dengan kontrol *backpressure* penuh di [ingestion_server.py](file:///d:/AI-AGEN%20DRIVEN%20INTELLIGENT%20INCIDENT%20ANALIS/01_CORE_SERVER/ingestion_server.py):
    1.  **Pemisahan Antrean (Decoupled Pipelines)**: Mengganti antrean tunggal dengan tiga antrean thread-safe baru yang berkapasitas terbatas:
        *   \`metric_queue = queue.Queue(maxsize=20000)\`: Untuk memproses metrik kinerja numerik (seperti CPU, RAM, disk, latency) ke tabel partisi database.
        *   \`log_queue = queue.Queue(maxsize=10000)\`: Untuk parsing log teks mentah (seperti syslog dan Windows Event logs) ke sistem pencatatan.
        *   \`event_queue = queue.Queue(maxsize=10000)\`: Untuk memproses event prioritas tinggi (registrasi perangkat baru dan update status liveness ONLINE/OFFLINE).
    2.  **Thread Pool Terisolasi**: Menjalankan thread pool paralel khusus per antrean untuk menghindari limitasi GIL (Global Interpreter Lock) Python pada operasi I/O-bound database:
        *   *Metrics Pool*: 4 worker thread.
        *   *Logs Pool*: 2 worker thread.
        *   *Events Pool*: 2 worker thread.
    3.  **Kontrol Backpressure & DLQ Fallback**: Mengubah pemanggilan antrean di \`handle_client\` menjadi non-blocking \`put_nowait()\`. Jika antrean mengalami overload dan penuh, exception \`queue.Full\` akan ditangkap secara otomatis dan payload dialihkan secara instan ke Dead Letter Queue (DLQ) hybrid di Redis (\`dlq_stream\`) dan PostgreSQL (\`dlq_hybrid\`) untuk mencegah kebocoran memori.
    4.  **Queue Monitoring & Observability**: Menambahkan daemon thread \`queue_monitor_loop\` yang memantau ukuran antrean aktif (\`qsize()\`) setiap 5 detik dan menuliskan statusnya ke Redis key \`metrics:ingestor_queues\` agar terpantau dari dasbor.
*   **Uji Validasi**: Seluruh arsitektur paralel ini telah diuji dan divalidasi 100% lulus (Pass) menggunakan unit test integrasi asinkron luring di [test_parallel_ingestion.py](file:///d:/AI-AGEN%20DRIVEN%20INTELLIGENT%20INCIDENT%20ANALIS/scratch/test_parallel_ingestion.py).

## 30. Optimasi Ingestion Pipeline ke Level Enterprise Real-World (STATUS: FIXED)

Kami telah menerapkan serangkaian peningkatan arsitektur tingkat enterprise pada layer ingestion telemetry di [ingestion_server.py](file:///d:/AI-AGEN%20DRIVEN%20INTELLIGENT%20INCIDENT%20ANALIS/01_CORE_SERVER/ingestion_server.py) dan daemon pemulihan di [dlq_replay_daemon.py](file:///d:/AI-AGEN%20DRIVEN%20INTELLIGENT%20INCIDENT%20ANALIS/01_CORE_SERVER/dlq_replay_daemon.py) untuk memastikan ketangguhan operasional, performa tinggi, dan skalabilitas ekstrim:

### A. Mitigasi Global Interpreter Lock (GIL) & Multiprocessing Offload
*   **Solusi**: Menggunakan \`concurrent.futures.ProcessPoolExecutor\` dengan 4 worker process mandiri untuk menangani seluruh beban komputasi CPU-bound (JSON decoding, validasi tanda tangan HMAC, penegakan skema JSON, dan pemrosesan mesin normalisasi telemetri) di luar thread socket utama.
*   **Hasil**: Thread penerima koneksi TCP menjadi sangat ringan (*non-blocking*), hanya mengirimkan pekerjaan ke process pool (melepaskan GIL saat menunggu I/O antar-proses) dan meningkatkan kapasitas penanganan koneksi konkuren hingga 5x lipat.

### B. Replay Riil DLQ & Isolasi Pesan Racun (Poison Queue)
*   **Solusi**: Memperbarui [dlq_replay_daemon.py](file:///d:/AI-AGEN%20DRIVEN%20INTELLIGENT%20INCIDENT%20ANALIS/01_CORE_SERVER/dlq_replay_daemon.py) untuk mengirimkan ulang payload telemetri asli menggunakan koneksi socket TCP riil ke \`127.0.0.1:8800\`.
*   **Exponential Backoff & Guardrails**: Menerapkan waktu tunda eksponensial berdasarkan rumus \`base_delay * 2^retry_count\` untuk setiap percobaan ulang. Jika pengiriman gagal berturut-turut sebanyak 5 kali, pesan diisolasi secara permanen ke tabel \`dlq_poison\` untuk mencegah *infinite loop* kegagalan. Kunci tanda tangan HMAC dan timestamp diperbarui otomatis ke waktu saat ini oleh daemon sebelum replay untuk melewati batasan waktu otentikasi 5 menit server.

### C. Jaminan Urutan Kronologis (Device-Level Ordering Guarantee)
*   **Solusi**: Menerapkan *Mutex Lock Map* reentrant (\`threading.RLock\`) dinamis berbasis kunci nama perangkat (\`device_name\`).
*   **Hasil**: Setiap kali thread worker memproses telemetri atau status perangkat kasir klien tertentu, thread tersebut harus memperoleh lock perangkat terkait terlebih dahulu sebelum menulis ke database PostgreSQL. Ini memastikan tidak ada kondisi balapan (*race condition*) dan menjamin urutan data masuk (seperti event OFFLINE/ONLINE) di database tidak terbalik secara kronologis.

### D. Observability & Metrik Operasional Mendalam
*   **Solusi**: Memperluas pemantauan \`queue_monitor_loop\` untuk menghitung dan merekam statistik operasional internal ke dalam Redis hash \`metrics:ingestor_queues\`.
*   **Metrik Baru**: Mencakup rata-rata latency pemrosesan (\`avg_processing_latency_ms\`), throughput sukses per 5 detik (\`processed_throughput_5s\`), rasio kesalahan (\`error_rate_5s\`), dan rasio DLQ (\`dlq_rate_5s\`), memberikan visibilitas penuh terhadap kesehatan pipeline ingestion.

### E. Load Shedding Bertingkat Dinamis (Graceful Degradation)
*   **Solusi**: Sistem secara otomatis memeriksa rasio keterisian antrean telemetri (\`metric_queue\`, \`log_queue\`, \`event_queue\`) dan menerapkan degradasi bertahap:
    *   **Level 1 (Beban > 80%)**: Membuang log teks non-error secara langsung untuk menghemat ruang disk dan CPU.
    *   **Level 2 (Beban > 90%)**: Membuang metrik non-kritis dan mengaktifkan window deduplikasi Redis selama 10 detik.
    *   **Level 3 (Beban > 95%)**: Mengalihkan seluruh data metrik/log langsung ke DLQ; hanya memproses event kritis (liveness/status) dan registrasi perangkat secara instan.

### F. Validasi Skema JSON Ketat & Penulisan DB Batch
*   **Skema Validator**: Menguji kelengkapan tipe data kunci terstruktur (\`agent\`, \`layer\`, \`status\`, \`timestamp\`, \`token\`, \`schema_version\`, \`metadata\`) sebelum enqueuing.
*   **Batch Insert**: Menggunakan \`psycopg2.extras.execute_values\` untuk mengelompokkan penulisan metrik dan log ke PostgreSQL dalam satu transaksi transaksi tunggal (batch size 50, timeout 1 detik), mengurangi beban koneksi database.

### G. Uji Validasi Integrasi

### A. Komponen Memori Kognitif yang Diimplementasikan
*   **Working Memory**: Mengelola status transien dan konteks insiden yang sedang ditangani secara langsung (misalnya, melacak "Incident 3487"). Dilengkapi dengan pemantauan penumpukan spooler cetak secara real-time. Jika antrean dokumen spooler mencapai >= 15, sistem secara otomatis memicu peringatan kritis: \`"[PERINGATAN MEMORY] Penumpukan spooler terdeteksi kritis: 15+ dokumen menumpuk!"\`.
*   **Episode Memory**: Menyimpan data kejadian historis spesifik beserta stempel waktu (seperti stempel waktu printer kasir yang mengalami offline pada bulan lalu jam 08.30).
*   **Semantic Memory**: Menyimpan korelasi kausal dan fakta yang digeneralisasi (misalnya, mengaitkan fakta bahwa printer Epson TM-T82 biasanya mengalami kerusakan/offline karena masalah port/kabel USB).

### B. Algoritma Pembusukan (Decay) & Melupakan (Forgetting) Memori
*   **Pembusukan Memori (Decay)**: Mengurangi nilai kepercayaan (confidence score) dari fakta semantik dan kejadian episodik secara berkala seiring berjalannya waktu untuk mencerminkan degradasi informasi yang tidak diperkuat kembali.
*   **Melupakan Memori (Forgetting)**: Memotong dan menghapus (pruning) entri memori yang tingkat kepercayaan/relevansinya telah turun di bawah ambang batas (forget threshold sebesar 0.2 atau 20%), menjaga ukuran basis memori AI tetap efisien dan bebas dari data sampah historis.

## 33. Integrasi Structural Causal Model (SCM) & Causal AI Core (STATUS: FIXED)
*   **Modul Baru**: Membuat [causal_engine.py](file:///d:/AI-AGEN%20DRIVEN%20INTELLIGENT%20INCIDENT%20ANALIS/01_CORE_SERVER/causal_engine.py) sebagai Tier 4 Causal AI Core untuk mendefinisikan hubungan sebab-akibat searah (*directed causal paths*).
*   **Struktur Data Relasi**: Setiap relasi kausalitas disimpan dalam kelas \`CausalRelation\` dengan atribut:
    *   \`cause\`: Akar penyebab (sebab).
    *   \`effect\`: Gejala akhir yang diamati (akibat).
    *   \`probability\`: Probabilitas bersyarat awal \$P(\\text{Effect} \\mid \\text{Cause})\$.
    *   \`confidence\`: Tingkat kepercayaan model kausalitas.
    *   \`support_evidence\`: Daftar bukti pendukung terarah.
    *   \`counter_evidence\`: Daftar bukti penyangkal/counter terarah.
*   **Diferensiasi Arah Sebab-Akibat**: Membedakan probabilitas berdasarkan arah kausalitas secara eksplisit:
    *   \$\\text{USB Failure} \\rightarrow \\text{Printer Offline}\$: Probabilitas \$93\\%\$ (Confidence \$95\\%\$).
    *   \$\\text{Printer Offline} \\rightarrow \\text{USB Failure}\$: Probabilitas \$40\\%\$ (Confidence \$50\\%\$).
*   **Evaluasi & Penyesuaian Probabilitas Dinamis**:
    *   Metode \`evaluate_candidacy\` pada \`CausalEngine\` membandingkan gejala yang diamati secara riil dengan bukti pendukung (*support*) dan penyangkal (*counter*).
    *   **Formula Penyesuaian**:
        \$\$P_{\\text{adjusted}} = P_{\\text{awal}} + (0.05 \\times N_{\\text{matched\\_support}}) - (0.15 \\times N_{\\text{matched\\_counter}})\$\$
        Dibatasi dalam rentang \$[0.0, 1.0]\$.
*   **Integrasi Alur Diagnostik**:
    *   Modul [honest_agent_core.py](file:///d:/AI-AGEN%20DRIVEN%20INTELLIGENT%20INCIDENT%20ANALIS/01_CORE_SERVER/honest_agent_core.py) pada metode \`_apply_calibration\` mengekstrak gejala dari detail insiden secara dinamis dan menyisipkan jalur kausalitas SCM yang relevan ke dalam dict hasil RCA (\`res["causal_paths"]\`).
*   **Visualisasi Dasbor NOC**:
    *   Metode \`format_for_dashboard\` merender pohon relasi SCM secara terstruktur menggunakan karakter *box-drawing* (\`├─\`, \`└─\`, \`│\`), membedakan probabilitas awal vs dinamis, serta menandai bukti mana saja yang cocok dengan label \`[MATCHED]\`.

### A. Alur Kerja Deteksi & Rute Evaluasi AI

Sistem orkestrator pusat (\`orchestrator.py\`) secara dinamis membagi alur pemrosesan insiden menjadi dua jalur utama berdasarkan deteksi detak jantung, ketersediaan jaringan, dan waktu respon API LLM:

1.  **Jalur Cloud LLM (Token-Based dengan DLP)**
    *   **Keamanan API Key**: Kunci API untuk Gemini/DeepSeek tidak disimpan secara plaintext. Sistem memuat token terenkripsi AES-256 dari \`ai_config.json\` dan mendekripsinya secara asinkron di memori menggunakan \`security.decrypt()\` saat runtime.
    *   **Data Loss Prevention (DLP)**: Sebelum telemetri dikirim ke cloud, kelas \`DataLossPrevention\` di \`multi_ai_learner.py\` melakukan sanitasi regex tingkat lanjut terhadap log telemetri:
        *   Menyensor IP eksternal dan lokal (misalnya \`192.168.x.x\` atau IP publik).
        *   Menyamarkan path sistem operasi Windows, nama pengguna (\`C:\\Users\\<USER>\`), dan kredensial.
        *   Mengganti data sensitif dengan token anonim seperti \`[MASKED_IP]\`, \`[MASKED_PATH]\`, atau \`[MASKED_TOKEN]\`.
    *   **Pipa Kognitif**: LLM Cloud menerima payload bersih dan mengeksekusi *18-Step Cognitive Loop* untuk melakukan penalaran RCA yang kompleks, menulis laporan penalaran kognitif, dan merancang skrip mitigasi.

2.  **Jalur Local LLM (Luring Random Forest Fallback)**
    *   **Pemicu Otomatis (Circuit Breaker)**: Jika API Cloud LLM mati, memicu batas waktu (*timeout* > 10 detik), atau mendeteksi kegagalan otentikasi kunci, sirkuit otomatis beralih ke mesin klasifikasi luring lokal.
    *   **Arsitektur Model**: Fallback lokal dijalankan oleh kelas \`LocalClassifierLearner\` (\`local_classifier_learner.py\`) menggunakan model Random Forest murni dalam format JSON (\`local_classifier_pure.json\`) tanpa ketergantungan pada pustaka C++ berat atau PyTorch/TensorFlow.
    *   **Ekstraksi Fitur**: Menggunakan metode pembobotan kata TF-IDF lokal yang diimplementasikan secara mandiri dalam Python murni untuk mengonversi gejala insiden menjadi vektor fitur.
    *   **Penjelasan L7**: Menghasilkan penjelasan RCA terstruktur berdasarkan klasifikasi pohon keputusan dan mengambil SOP luring dari file cache \`local_knowledge_base.json\` untuk diserahkan ke AI Supervisor.

        document.getElementById('audit-content').innerHTML = marked.parse(markdownText);

        document.querySelectorAll('pre code.language-mermaid').forEach(function(codeEl) {

        mermaid.run({
            querySelector: '.mermaid'
        }).then(() => {

            // =============================================
            // FULLSCREEN LIGHTBOX ENGINE
            // =============================================
            const lightbox   = document.getElementById('diagram-lightbox');
            const lbCanvas   = document.getElementById('lb-canvas');
            const lbWrapper  = document.getElementById('lb-svg-wrapper');
            const lbLabel    = document.getElementById('lb-scale-label');
            const lbZoomIn   = document.getElementById('lb-zoom-in');
            const lbZoomOut  = document.getElementById('lb-zoom-out');
            const lbReset    = document.getElementById('lb-reset');
            const lbClose    = document.getElementById('lb-close-btn');

            let scale = 1;
            let originX = 0, originY = 0;   // translate offset
            let isDragging = false;
            let dragStartX = 0, dragStartY = 0;
            let lastOriginX = 0, lastOriginY = 0;

            function applyTransform(animate) {
                lbWrapper.style.transition = animate ? 'transform 0.2s ease' : 'none';
                lbWrapper.style.transform =
                    'translate(' + originX + 'px, ' + originY + 'px) scale(' + scale + ')';
                lbLabel.textContent = Math.round(scale * 100) + '%';
            }

            function openLightbox(svgEl) {
                // Clone SVG — hapus size constraints agar mengisi canvas
                const clone = svgEl.cloneNode(true);
                clone.removeAttribute('width');
                clone.removeAttribute('height');
                clone.removeAttribute('style');
                clone.style.display = 'block';

                // Hitung ukuran yang ideal: fit dalam viewport
                const vw = window.innerWidth, vh = window.innerHeight - 60;
                const vb = clone.getAttribute('viewBox');
                if (vb) {
                    const parts = vb.trim().split(/[\s,]+/);
                    const svgW = parseFloat(parts[2]) || vw;
                    const svgH = parseFloat(parts[3]) || vh;
                    const fitScale = Math.min(vw / svgW, vh / svgH) * 0.88;
                    const renderW = svgW * fitScale;
                    const renderH = svgH * fitScale;
                    clone.style.width  = renderW + 'px';
                    clone.style.height = renderH + 'px';
                } else {
                    clone.style.maxWidth  = '90vw';
                    clone.style.maxHeight = '88vh';
                }

                lbWrapper.innerHTML = '';
                lbWrapper.appendChild(clone);

                // Reset state
                scale = 1; originX = 0; originY = 0;
                applyTransform(false);
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
                lbWrapper.innerHTML = '';
            }

            // Zoom buttons
            lbZoomIn.addEventListener('click', function(e) {
                e.stopPropagation();
                scale = Math.min(scale * 1.25, 10);
                applyTransform(true);
            });

            lbZoomOut.addEventListener('click', function(e) {
                e.stopPropagation();
                scale = Math.max(scale / 1.25, 0.1);
                applyTransform(true);
            });

            lbReset.addEventListener('click', function(e) {
                e.stopPropagation();
                scale = 1; originX = 0; originY = 0;
                applyTransform(true);
            });

            lbClose.addEventListener('click', closeLightbox);

            // Klik backdrop untuk tutup
            lbCanvas.addEventListener('click', function(e) {
                if (e.target === lbCanvas) closeLightbox();
            });

            // ESC untuk tutup
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === '+' || e.key === '=') { scale = Math.min(scale * 1.2, 10); applyTransform(true); }
                if (e.key === '-') { scale = Math.max(scale / 1.2, 0.1); applyTransform(true); }
                if (e.key === '0') { scale = 1; originX = 0; originY = 0; applyTransform(true); }
            });

            // Scroll wheel zoom (terpusat pada posisi kursor)
            lbCanvas.addEventListener('wheel', function(e) {
                e.preventDefault();
                const rect = lbCanvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left - rect.width / 2;
                const mouseY = e.clientY - rect.top  - rect.height / 2;

                const zoomFactor = e.deltaY < 0 ? 1.12 : 0.9;
                const newScale = Math.min(Math.max(scale * zoomFactor, 0.1), 10);
                const scaleDelta = newScale / scale;

                // Adjust origin agar zoom terpusat di posisi kursor
                originX = mouseX + (originX - mouseX) * scaleDelta;
                originY = mouseY + (originY - mouseY) * scaleDelta;
                scale = newScale;
                applyTransform(false);
            }, { passive: false });

            // Drag to pan — Mouse
            lbCanvas.addEventListener('mousedown', function(e) {
                if (e.button !== 0) return;
                isDragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                lastOriginX = originX;
                lastOriginY = originY;
                lbCanvas.classList.add('dragging');
                e.preventDefault();
            });

            document.addEventListener('mousemove', function(e) {
                if (!isDragging) return;
                originX = lastOriginX + (e.clientX - dragStartX);
                originY = lastOriginY + (e.clientY - dragStartY);
                applyTransform(false);
            });

            document.addEventListener('mouseup', function() {
                if (!isDragging) return;
                isDragging = false;
                lbCanvas.classList.remove('dragging');
            });

            // Drag to pan — Touch
            let lastTouchX = 0, lastTouchY = 0;
            let lastPinchDist = 0;

            lbCanvas.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    isDragging = true;
                    lastTouchX = e.touches[0].clientX;
                    lastTouchY = e.touches[0].clientY;
                    lastOriginX = originX;
                    lastOriginY = originY;
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    lastPinchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
                e.preventDefault();
            }, { passive: false });

            lbCanvas.addEventListener('touchmove', function(e) {
                if (e.touches.length === 1 && isDragging) {
                    originX = lastOriginX + (e.touches[0].clientX - lastTouchX);
                    originY = lastOriginY + (e.touches[0].clientY - lastTouchY);
                    applyTransform(false);
                } else if (e.touches.length === 2) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    if (lastPinchDist > 0) {
                        scale = Math.min(Math.max(scale * (dist / lastPinchDist), 0.1), 10);
                        applyTransform(false);
                    }
                    lastPinchDist = dist;
                }
                e.preventDefault();
            }, { passive: false });

            lbCanvas.addEventListener('touchend', function() {
                isDragging = false;
                lastPinchDist = 0;
            });

            // =============================================
            // BUNGKUS SETIAP DIAGRAM DENGAN WRAPPER & KLIK
            // =============================================
            document.querySelectorAll('.mermaid').forEach(function(mermaidEl) {
                const wrapper = document.createElement('div');
                wrapper.className = 'diagram-wrapper';

                mermaidEl.parentNode.insertBefore(wrapper, mermaidEl);
                wrapper.appendChild(mermaidEl);

                // Klik diagram → buka lightbox
                wrapper.addEventListener('click', function() {
                    const svgEl = mermaidEl.querySelector('svg');
                    if (svgEl) openLightbox(svgEl);
                });
            });

        });

        // Theme Toggle Handler
        const toggleBtn = document.getElementById('theme-toggle');
        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            if (document.body.classList.contains('light-theme')) {
                toggleBtn.textContent = '🌙 DARK MODE';
            } else {
                toggleBtn.textContent = '☀️ LIGHT MODE';
            }
        });

        // =============================================
        // DYNAMIC TABLE OF CONTENTS (TOC)
        // =============================================
        const tocContainer = document.getElementById('toc');
        const SCROLL_OFFSET = 80; // offset dari atas agar tidak tertutup

        // Ambil semua heading H1 dan H2
        const headings = document.querySelectorAll('#audit-content h1, #audit-content h2');

        headings.forEach((heading, idx) => {
            const id = 'section-' + idx;
            heading.id = id;

            const isH1 = heading.tagName === 'H1';
            const isH2 = heading.tagName === 'H2';

            if (isH1 || isH2) {
                const li = document.createElement('li');
                li.className = 'toc-item' + (isH1 ? ' toc-h1' : ' toc-h2');
                li.dataset.target = id;

                const a = document.createElement('a');
                a.href = '#' + id;
                a.textContent = heading.textContent.trim();
                a.title = heading.textContent.trim();

                // Smooth scroll dengan offset (supaya tidak tertutup fixed header/sidebar)
                a.addEventListener('click', function(e) {
                    e.preventDefault();
                    const target = document.getElementById(id);
                    if (!target) return;

                    const targetTop = target.getBoundingClientRect().top + window.scrollY - SCROLL_OFFSET;
                    window.scrollTo({ top: targetTop, behavior: 'smooth' });

                    // Tandai aktif langsung saat diklik
                    document.querySelectorAll('.toc-item').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');

                    // Scroll TOC agar item yang aktif terlihat di sidebar
                    li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                });

                li.appendChild(a);
                tocContainer.appendChild(li);
            }
        });

        // Highlight TOC item aktif saat scroll
        const allTocItems = document.querySelectorAll('.toc-item');

        function updateActiveToc() {
            let currentId = null;
            headings.forEach((heading) => {
                const top = heading.getBoundingClientRect().top;
                if (top <= SCROLL_OFFSET + 10) {
                    currentId = heading.id;
                }
            });

            allTocItems.forEach((item) => {
                if (item.dataset.target === currentId) {
                    item.classList.add('active');
                    // Auto-scroll TOC sidebar ke item aktif
                    item.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                } else {
                    item.classList.remove('active');
                }
            });
        }

        window.addEventListener('scroll', updateActiveToc, { passive: true });
        // Jalankan sekali saat load
        updateActiveToc();
    </script>
</body>
</html>
