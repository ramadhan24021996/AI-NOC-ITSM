<!-- p-pchealth.html - Extracted HTML Partial Component -->
<div id="p-pchealth" class="panel">
  <div id="pc-kpi-strip" class="kpi-row" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px">
    <div class="kpi" style="padding:10px 12px"><div class="kpi-lbl">Total PC</div><div class="kpi-val" id="pc-kpi-total">—</div></div>
    <div class="kpi" style="padding:10px 12px"><div class="kpi-lbl">Online</div><div class="kpi-val" id="pc-kpi-online" style="color:var(--green)">—</div></div>
    <div class="kpi" style="padding:10px 12px"><div class="kpi-lbl">Offline / Faulty</div><div class="kpi-val" id="pc-kpi-offline" style="color:var(--red2)">—</div></div>
    <div class="kpi" style="padding:10px 12px"><div class="kpi-lbl">Avg CPU / RAM</div><div class="kpi-val" id="pc-kpi-avg" style="font-size:15px;color:var(--cyan)">—</div></div>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center">
    <div class="tbl-search" style="width:220px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="pc-search" placeholder="Cari device/IP..." oninput="Panels.pchealth.applyFilters()"></div>
    <select class="inp" style="width:130px;padding:4px 7px" id="pc-filter-status" onchange="Panels.pchealth.applyFilters()"><option value="">Semua Status</option><option>ONLINE</option><option>OFFLINE</option><option>FAULTY</option></select>
    <select class="inp" style="width:150px;padding:4px 7px" id="pc-filter-site" onchange="Panels.pchealth.applyFilters()"><option value="">Semua Site</option></select>
    <div style="margin-left:auto;display:flex;gap:6px">
      <button class="btn btn-ghost btn-sm" onclick="Panels.pchealth.exportCSV()"><i class="fa-solid fa-download" style="margin-right:6px"></i>CSV</button>
      <button class="btn btn-primary btn-sm" onclick="Panels.pchealth.load()"><i class="fa-solid fa-rotate" style="margin-right:6px"></i>Refresh</button>
    </div>
  </div>
  <div id="pc-grid" class="device-grid"></div>
  <!-- PC Detail Modal trigger -->
  <div class="card" id="pc-detail-card" style="margin-top:12px; display:none">
    <div class="card-header">
      <h3 id="pc-detail-title"><i class="fa-solid fa-desktop" style="color:var(--blue);margin-right:8px"></i>Detail PC</h3>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="Panels.pchealth.refreshCurrentDetail()"><i class="fa-solid fa-rotate" style="margin-right:6px"></i>Refresh</button>
        <button class="btn btn-ghost btn-sm" onclick="Panels.pchealth.closeDetail()"><i class="fa-solid fa-xmark" style="margin-right:6px"></i>Tutup</button>
      </div>
    </div>
    <div class="card-body" id="pc-detail-body"></div>
  </div>
</div>

     PANEL: PRINTER STATUS
