name: OSI Enterprise CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  test-python:
    name: Run Python AI Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f SERVER/python_ai_core/requirements.txt ]; then pip install -r SERVER/python_ai_core/requirements.txt; fi
          pip install pytest pytest-asyncio
          
      - name: Run Pytest (Unit Tests)
        run: |
          pytest tests/unit/python_ai/ -v

  test-go:
    name: Run Go Ingestion & Agent Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Install Go dependencies
        run: |
          go mod download
          
      - name: Run Go Unit Tests
        run: |
          go test -v ./tests/unit/go_core/...

  build-release:
    name: Build Multi-Platform Binaries
    needs: [test-python, test-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Build Windows Agent (amd64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p release_binaries/windows_amd64
          go build -ldflags="-s -w" -o release_binaries/windows_amd64/agent.exe ./CLIENT_DISTRIBUSI_GO/agent/main.go
          
      - name: Build Linux Agent (amd64)
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p release_binaries/linux_amd64
          go build -ldflags="-s -w" -o release_binaries/linux_amd64/linux_agent ./CLIENT_DISTRIBUSI_GO/linux_agent/main.go
          
      - name: Build Go Ingestion Server (Linux)
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags="-s -w" -o release_binaries/linux_amd64/ingestion_server ./SERVER/go_core/ingestion_server/main.go
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: osi-release-binaries
          path: release_binaries/
          retention-days: 7
