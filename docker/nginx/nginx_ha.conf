user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Docker DNS resolver for dynamic backend resolution on container restart
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ── AGENT TELEMETRY PROXY (Port 80) ────────────────────────────────────
    # Agen Windows/Linux mengirim data via port 80 (tidak pernah diblokir router/firewall).
    # Nginx menerima di port 80 lalu meneruskan ke ingestion server di port 18800.
    upstream ingestion_backend {
        # 1. PRIMARY ROUTE: Golang Ingestion Server
        server osi-ingestion-server:18800;
        
        # 2. FAILOVER ROUTE: n8n Webhook (aktif saat Go Ingestion mati)
        server n8n_workflow_engine:5678 backup;
        
        keepalive 64;
    }

    # n8n Webhook upstream (path rewrite untuk failover)
    upstream n8n_backend {
        server n8n_workflow_engine:5678;
        keepalive 16;
    }

    # [FASE0 K-10] upstream agent_dist_backend dihapus: agent-dist-server dinonaktifkan.
    # Upstream statis ke host yang tidak ada membuat nginx gagal start.

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 20M;

        # Dynamic backend variables to enforce DNS re-resolution via resolver 127.0.0.11
        set $dashboard_target "http://osi-dashboard-server:9999";
        set $ingestion_target "http://osi-ingestion-server:18800";

        # ── [FASE0] BLOKIR DARURAT route tanpa autentikasi (sementara sampai WS-1/4/5/7) ──
        # K-07: /api/approval bisa memalsukan persetujuan HITL (blokir exact match saja agar /api/approval_queue & /api/approval_outbox tetap dapat diakses)
        # K-06: /api/issues menerima XSS tersimpan tanpa auth
        # K-08: /ws/client_chat tanpa auth
        # T-07/K-07: /jarvis/voice/query tanpa auth
        # T-03: /downloads directory listing publik
        location = /api/approval       { return 403; }
        location ^~ /api/issues        { return 403; }
        location ^~ /ws/client_chat    { return 403; }
        location ^~ /jarvis/voice/query { return 403; }
        location ^~ /downloads         { return 403; }
        location ^~ /agent-dist/       { return 403; }

        # Khusus untuk WebSocket Chat
        location ^~ /api/chat/ws {
            proxy_pass $ingestion_target;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # WebSocket specific headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
        }

        # Dedicated n8n failover endpoint (path rewrite ke /webhook/{path})
        # Digunakan sebagai route cadangan saat Go ingestion server mati
        location ^~ /webhook/ {
            proxy_pass http://n8n_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
        }

        # Semua endpoint telemetri agen diteruskan ke ingestion server (PRIMARY)
        # Jika primary mati (502/504), nginx otomatis failover ke n8n via @n8n_fallback
        location ~ ^/(telemetry|activity|issues|health|browser-events|ingest|api/chat|api/activity|api/telemetry|uploads|download/) {
            proxy_pass $ingestion_target;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;

            # Failover otomatis ke n8n jika primary mati
            proxy_intercept_errors on;
            error_page 502 503 504 = @n8n_fallback;
        }

        # Named location untuk failover ke n8n dengan path rewrite /X → /webhook/X
        location @n8n_fallback {
            rewrite ^/(.*)$ /webhook/$1 break;
            proxy_pass http://n8n_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            add_header X-Failover-Route "n8n-backup" always;
        }

        # Forward downloads and fleet update directly to dashboard backend without HTTPS redirection
        location ~ ^/api/fleet/update {
            proxy_pass $dashboard_target;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            proxy_connect_timeout 10s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @dashboard_maintenance;
        }

        # Dashboard web application routing (Served directly over HTTP to avoid SSL errors on local IPs)
        location / {
            proxy_pass $dashboard_target;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Nginx akan menampilkan maintenance page jika dashboard backend down
            # sehingga nginx TIDAK crash — hanya return 503 ke klien
            proxy_intercept_errors on;
            error_page 502 503 504 = @dashboard_maintenance;
        }

        # Maintenance fallback — dashboard sedang restart/unavailable
        location @dashboard_maintenance {
            default_type text/html;
            return 503 '<html><head><title>Dashboard Maintenance</title><meta http-equiv="refresh" content="10"><style>body{font-family:sans-serif;background:#0f172a;color:#94a3b8;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column}h1{color:#f59e0b;font-size:2rem}p{font-size:1.1rem}span{color:#22d3ee}</style></head><body><h1>&#x26A0; AI NOC Dashboard</h1><p>Dashboard server sedang restart otomatis...</p><p>Halaman akan refresh otomatis dalam <span>10</span> detik.</p><p style="font-size:0.85rem;opacity:0.6">Infrastruktur AI berjalan normal. Hanya portal yang restart.</p></body></html>';
        }

        # Gorilla WebSocket routing for real-time logs & JARVIS Full-Duplex Voice
        location /ws/ {
            proxy_pass $dashboard_target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /api/jarvis/voice/duplex {
            proxy_pass $dashboard_target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # HTTPS Server (Port 443 inside container, 9443 outside)
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Redirect plain HTTP requests on HTTPS port automatically to HTTPS
        error_page 497 https://$http_host$request_uri;

        # SSL Hardening Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self' http: https: ws: wss: data: blob: mediastream: 'unsafe-inline' 'unsafe-eval';" always;

        client_max_body_size 50M;

        set $dashboard_target "http://osi-dashboard-server:9999";

        # ── [FASE0] BLOKIR DARURAT (lihat server port 80) ──
        location = /api/approval       { return 403; }
        location ^~ /api/issues        { return 403; }
        location ^~ /ws/client_chat    { return 403; }
        location ^~ /jarvis/voice/query { return 403; }
        location ^~ /downloads         { return 403; }

        # Dashboard web application routing
        location / {
            proxy_pass $dashboard_target;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_intercept_errors on;
            error_page 502 503 504 = @dashboard_maintenance_ssl;
        }

        # SSL Maintenance fallback
        location @dashboard_maintenance_ssl {
            default_type text/html;
            return 503 '<html><head><title>Dashboard Maintenance</title><meta http-equiv="refresh" content="10"><style>body{font-family:sans-serif;background:#0f172a;color:#94a3b8;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;flex-direction:column}h1{color:#f59e0b;font-size:2rem}p{font-size:1.1rem}span{color:#22d3ee}</style></head><body><h1>&#x26A0; AI NOC Dashboard</h1><p>Dashboard server sedang restart otomatis...</p><p>Halaman akan refresh otomatis dalam <span>10</span> detik.</p></body></html>';
        }

        # Gorilla WebSocket routing for real-time logs & JARVIS Full-Duplex Voice
        location /ws/ {
            proxy_pass $dashboard_target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /api/jarvis/voice/duplex {
            proxy_pass $dashboard_target;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # [FASE0 K-10] Agent Distribution dinonaktifkan (http.server publik membuka source).
        location ^~ /agent-dist/ { return 403; }
    }
}
