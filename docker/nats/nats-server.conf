# NATS server production configuration
host: "0.0.0.0"
port: 4222

# Logging options
debug: false
trace: false
logtime: true

# Connection limits
max_connections: 1000
max_payload: 1048576 # 1MB
write_deadline: "10s"

# Monitoring HTTP port (for JetStream lag audit)
http_port: 8222

# JetStream Configuration
jetstream {
  store_dir: "/data/nats/jetstream"
  max_mem: 1G
  max_file: 10G
}

# Cluster HA Preparation (disabled for single-node local environment)
# server_name: "osi-nats-node"
# cluster {
