# NATS JetStream Cluster - Node 2 Configuration
server_name: "nats-node-2"
port: 4223
http_port: 8223

cluster {
  name: "OSI_NATS_HA_CLUSTER"
  listen: "0.0.0.0:6223"
  routes: [
    "nats-route://127.0.0.1:6222"
  ]
}

jetstream {
  store_dir: "/tmp/nats/jetstream/node2"
  max_mem: 1Gb
  max_file: 10Gb
}
