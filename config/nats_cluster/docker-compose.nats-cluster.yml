version: '3.8'

services:
  nats-node1:
    image: nats:latest
    container_name: nats-node1
    command: ["-c", "/etc/nats/node1.conf"]
    volumes:
      - ./node1.conf:/etc/nats/node1.conf
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    restart: always

  nats-node2:
    image: nats:latest
    container_name: nats-node2
    command: ["-c", "/etc/nats/node2.conf"]
    volumes:
      - ./node2.conf:/etc/nats/node2.conf
    ports:
      - "4223:4223"
      - "6223:6223"
      - "8223:8223"
    restart: always
