# NATS JetStream Cluster - Node 1 Configuration
server_name: "nats-node-1"
port: 4222
http_port: 8222

cluster {
  name: "OSI_NATS_HA_CLUSTER"
  listen: "0.0.0.0:6222"
  routes: [
    "nats-route://127.0.0.1:6223"
  ]
}

jetstream {
  store_dir: "/tmp/nats/jetstream/node1"
  max_mem: 1Gb
  max_file: 10Gb
}
