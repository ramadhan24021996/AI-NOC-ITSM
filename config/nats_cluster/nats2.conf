# NATS Cluster Node 2 Configuration
port: 4222
http_port: 8222

server_name: nats-node-2

jetstream {
    store_dir: "/data/nats"
    max_mem: 1G
    max_file: 10G
}

cluster {
    name: "osi-nats-cluster"
    listen: "0.0.0.0:6222"
    routes = [
        "nats://nats1:6222",
        "nats://nats3:6222"
    ]
}
