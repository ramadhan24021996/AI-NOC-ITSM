services:
  nginx:
    image: nginx:1.25-alpine
    container_name: osi-nginx
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PROXY_HTTP_PORT:-8099}:80"
      - "${PROXY_HTTPS_PORT:-9443}:443"
    volumes:
      - ./docker/nginx/nginx_ha.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      dashboard-server:
        condition: service_started
    networks:
      - osi-frontend
      - osi-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: pgvector/pgvector:pg15
    container_name: osi-postgres
    restart: always
    shm_size: "256mb"
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${DB_NAME:-osi_system}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - osi-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-osi_system}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: osi-redis
    restart: always
    security_opt:
      - no-new-privileges:true
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    environment:
      - REDISCLI_AUTH=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - osi-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.9-alpine
    container_name: osi-nats
    restart: always
    security_opt:
      - no-new-privileges:true
    command: -c /etc/nats/nats-server.conf --auth ${NATS_TOKEN:?Set NATS_TOKEN in .env}
    volumes:
      - ./docker/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats_data:/data/nats
    ports:
      # [FASE0 T-08] NATS hanya untuk container internal; jangan expose ke publik
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"  # NATS monitoring/JetStream audit (localhost only)
    networks:
      - osi-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ingestion-server:
    build:
      context: .
      dockerfile: SERVER/go_core/Dockerfile
    container_name: osi-ingestion-server
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      # Expose ingestion ports directly to the host for Windows client agent connection
      # [FASE0] Ikat ke IP LAN internal (set AGENT_BIND_IP di .env). Default localhost = fail closed.
      - "${AGENT_BIND_IP:-127.0.0.1}:18800:18800"
      - "${AGENT_BIND_IP:-127.0.0.1}:18802:18802"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-osi_system}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - NATS_HOST=${NATS_HOST:-nats}
      - NATS_PORT=${NATS_PORT:-4222}
      - NATS_TOKEN=${NATS_TOKEN:?Set NATS_TOKEN in .env}
      - OSI_SECURITY_KEY=${OSI_SECURITY_KEY:?Set OSI_SECURITY_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ./build/bin/ingestion_server:/app/ingestion_server:ro
      - ./CLIENT_DISTRIBUSI_GO/05_SIAP_DISTRIBUSI:/app/CLIENT_DISTRIBUSI_GO/05_SIAP_DISTRIBUSI:ro
    networks:
      - osi-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  scheduler-service:
    build:
      context: .
      dockerfile: SERVER/go_core/Dockerfile
    container_name: osi-scheduler-service
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./build/bin/ingestion_server:/app/ingestion_server:ro
    environment:
      - ROLE=scheduler
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-osi_system}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - NATS_HOST=${NATS_HOST:-nats}
      - NATS_PORT=${NATS_PORT:-4222}
      - NATS_TOKEN=${NATS_TOKEN:?Set NATS_TOKEN in .env}
      - OSI_SECURITY_KEY=${OSI_SECURITY_KEY:?Set OSI_SECURITY_KEY in .env}
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - osi-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dashboard-server:
    build:
      context: .
      dockerfile: portal/Dockerfile
    container_name: osi-dashboard-server
    security_opt:
      - no-new-privileges:true
    volumes:
      # Mount compiled portal binary for instant hot restarts (< 3s)
      - ./build/bin/portal:/app/dashboard_server:ro
      # Mount configuration dynamic folder for hot-reloads
      - ./portal/templates:/app/templates:ro
      - ./portal/static:/app/static:ro
      - ./portal/remote_settings.json:/app/remote_settings.json:rw
      - ./portal/ai_config.json:/app/ai_config.json:rw
      # [T-11 / TEMUAN-2] Scoped read-only subfolder mounts (never mount root repo or .env)
      - ./CLIENT_DISTRIBUSI_GO/05_SIAP_DISTRIBUSI:/app/workspace/CLIENT_DISTRIBUSI_GO/05_SIAP_DISTRIBUSI:ro
      - ./SERVER/python_ai_core:/app/workspace/SERVER/python_ai_core:ro
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-osi_system}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - NATS_HOST=${NATS_HOST:-nats}
      - NATS_PORT=${NATS_PORT:-4222}
      - NATS_TOKEN=${NATS_TOKEN:?Set NATS_TOKEN in .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - OSI_SECURITY_KEY=${OSI_SECURITY_KEY:?Set OSI_SECURITY_KEY in .env}
      - LAUNCHER_HOST_IP=host.docker.internal
      - NETDATA_MASTER_URL=http://host.docker.internal:19999
      - TELEGRAM_BOT_TOKEN_CONFIGURED=${TELEGRAM_BOT_TOKEN:+true}
      - N8N_URL=${N8N_URL:-http://host.docker.internal:5678}
      - DEV_MODE=${DEV_MODE:-false}  # [R-07] secure default
      # JARVIS Voice API Server — Go proxy target (jarvis_api.go)
      - JARVIS_VOICE_API_URL=http://osi-jarvis-voice-server:8089
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - osi-frontend
      - osi-backend
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  secure-relay:
    build:
      context: .
      dockerfile: portal/Dockerfile.secure_relay
    container_name: osi-secure-relay
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./build/bin/secure_relay:/app/secure_relay:ro
    ports:
      # Expose secure relay port directly to host for agent requests
      - "${AGENT_BIND_IP:-127.0.0.1}:9998:9998"  # [FASE0 T-10]
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - OSI_SECURITY_KEY=${OSI_SECURITY_KEY:?Set OSI_SECURITY_KEY in .env}
    networks:
      - osi-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  telegram-bot-listener:
    build:
      context: .
      dockerfile: SERVER/go_core/telegram_bot/Dockerfile
    container_name: osi-telegram-bot
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-osi_system}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - AUTHORIZED_ADMINS=${AUTHORIZED_ADMINS}
      - OSI_SECURITY_KEY=${OSI_SECURITY_KEY:?Set OSI_SECURITY_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - osi-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  python-ai-core:
    build:
      context: ./SERVER/python_ai_core
      dockerfile: Dockerfile
    container_name: osi-python-ai-core
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./portal/ai_config.json:/app/ai_config.json:ro
      # [OCAI GOVERNANCE] AI source code mounted read-only (:ro) so AI cannot modify its own code
      - ./SERVER/python_ai_core:/app:ro
      - ./SERVER/python_ai_core/auto_generated_sops:/app/auto_generated_sops:rw
    environment:
      - NATS_URL=nats://${NATS_TOKEN:?Set NATS_TOKEN in .env}@${NATS_HOST:-nats}:${NATS_PORT:-4222}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OSI_SECURITY_KEY=${OSI_SECURITY_KEY:?Set OSI_SECURITY_KEY in .env}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-osi_system}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      # JARVIS NOC Bridge — live dashboard data access
      - JARVIS_DASHBOARD_BASE_URL=http://osi-dashboard-server:9999
      - JARVIS_NOC_TIMEOUT_MS=5000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - osi-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── JARVIS Voice API Server ─────────────────────────────────────────────────
  # Runs JarvisPresentationRuntime (Full Pipeline: STT → LLM → TTS → Intent Router)
  # Exposes POST /jarvis/voice/query | GET /jarvis/health | WS /jarvis/voice/duplex
  # Accessed by osi-dashboard-server Go proxy at http://osi-jarvis-voice-server:8089
  jarvis-voice-server:
    build:
      context: .
      dockerfile: ./SERVER/jarvis/Dockerfile
    container_name: osi-jarvis-voice-server
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./SERVER:/app/SERVER:ro
      - ./SERVER/jarvis/audit/logs:/app/SERVER/jarvis/audit/logs:rw
      - ./portal/ai_config.json:/app/ai_config.json:ro
    environment:
      - JARVIS_VOICE_API_HOST=0.0.0.0
      - JARVIS_VOICE_API_PORT=8089
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OSI_SECURITY_KEY=${OSI_SECURITY_KEY:?Set OSI_SECURITY_KEY in .env}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-osi_system}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - JARVIS_DASHBOARD_BASE_URL=http://osi-dashboard-server:9999
      - JARVIS_NOC_TIMEOUT_MS=8000
      - NATS_URL=nats://${NATS_TOKEN:?Set NATS_TOKEN in .env}@${NATS_HOST:-nats}:${NATS_PORT:-4222}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    networks:
      - osi-backend
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8089/jarvis/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  ai-consensus:
    build:
      context: ./SERVER/python_ai_core
      dockerfile: Dockerfile
    container_name: osi-ai-consensus
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./portal/ai_config.json:/app/ai_config.json:ro
      - ./SERVER/python_ai_core:/app:ro
    command: ["python", "-u", "services/consensus_service.py"]
    environment:
      - NATS_URL=nats://${NATS_TOKEN:?Set NATS_TOKEN in .env}@${NATS_HOST:-nats}:${NATS_PORT:-4222}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OSI_SECURITY_KEY=${OSI_SECURITY_KEY:?Set OSI_SECURITY_KEY in .env}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-osi_system}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - osi-backend

  ai-critic:
    build:
      context: ./SERVER/python_ai_core
      dockerfile: Dockerfile
    container_name: osi-ai-critic
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./portal/ai_config.json:/app/ai_config.json:ro
      - ./SERVER/python_ai_core:/app:ro
    command: ["python", "-u", "services/critic_service.py"]
    environment:
      - NATS_URL=nats://${NATS_TOKEN:?Set NATS_TOKEN in .env}@${NATS_HOST:-nats}:${NATS_PORT:-4222}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OSI_SECURITY_KEY=${OSI_SECURITY_KEY:?Set OSI_SECURITY_KEY in .env}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-osi_system}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - osi-backend

  ai-policy:
    build:
      context: ./SERVER/python_ai_core
      dockerfile: Dockerfile
    container_name: osi-ai-policy
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./portal/ai_config.json:/app/ai_config.json:ro
      - ./SERVER/python_ai_core:/app:ro
    command: ["python", "-u", "services/policy_service.py"]
    environment:
      - NATS_URL=nats://${NATS_TOKEN:?Set NATS_TOKEN in .env}@${NATS_HOST:-nats}:${NATS_PORT:-4222}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OSI_SECURITY_KEY=${OSI_SECURITY_KEY:?Set OSI_SECURITY_KEY in .env}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-osi_system}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - osi-backend

  ai-rag:
    build:
      context: ./SERVER/python_ai_core
      dockerfile: Dockerfile
    container_name: osi-ai-rag
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./portal/ai_config.json:/app/ai_config.json:ro
      - ./SERVER/python_ai_core:/app:ro
    command: ["python", "-u", "services/rag_service.py"]
    environment:
      - NATS_URL=nats://${NATS_TOKEN:?Set NATS_TOKEN in .env}@${NATS_HOST:-nats}:${NATS_PORT:-4222}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OSI_SECURITY_KEY=${OSI_SECURITY_KEY:?Set OSI_SECURITY_KEY in .env}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-osi_system}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - osi-backend

  ai-daemons:
    build:
      context: ./SERVER/python_ai_core
      dockerfile: Dockerfile
    container_name: osi-ai-daemons
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./portal/ai_config.json:/app/ai_config.json:ro
      - ./SERVER/python_ai_core:/app:ro
      - ./SERVER/python_ai_core/auto_generated_sops:/app/auto_generated_sops:rw
    command: ["python", "-u", "daemons/daemon_runner.py"]
    environment:
      - NATS_URL=nats://${NATS_TOKEN:?Set NATS_TOKEN in .env}@${NATS_HOST:-nats}:${NATS_PORT:-4222}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OSI_SECURITY_KEY=${OSI_SECURITY_KEY:?Set OSI_SECURITY_KEY in .env}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-osi_system}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - ENABLE_CHAOS_MONKEY=${ENABLE_CHAOS_MONKEY:-false}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - osi-backend

  # Portainer - Docker Management UI
  portainer:
    image: portainer/portainer-ce:2.39.4
    container_name: osi-portainer
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "${PORTAINER_BIND_IP:-127.0.0.1}:9000:9000"  # Default fail-closed localhost; set PORTAINER_BIND_IP in .env for LAN
      - "${PORTAINER_BIND_IP:-127.0.0.1}:9444:9443"  # Default fail-closed localhost; set PORTAINER_BIND_IP in .env for LAN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - osi-frontend
      - osi-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # [FASE0 K-10] DINONAKTIFKAN: http.server publik membuka listing + seluruh source.
  # Tidak akan start kecuali dijalankan eksplisit dengan --profile insecure-dist.
  agent-dist-server:
    profiles: ["insecure-dist"]
    image: python:3.11-alpine
    container_name: osi-agent-dist
    restart: "no"
    security_opt:
      - no-new-privileges:true
    command: python -m http.server 9090
    working_dir: /dist
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./CLIENT_DISTRIBUSI_GO:/dist:ro
    networks:
      - osi-backend

  # ── pgAdmin4 — PostgreSQL Database Management UI ─────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:8.4
    container_name: osi-pgadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:5050:80"  # [FASE0]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-${DB_PASSWORD:?Set PGADMIN_PASSWORD or DB_PASSWORD in .env}}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGADMIN_CONFIG_SESSION_EXPIRATION_TIME: 1440
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - osi-backend
      - osi-frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Apache Kafka Enterprise Stream Cluster ───────────────────────────────────
  # Mendukung: osi.telemetry | osi.incidents | osi.remediation | osi.knowledge | osi.governance
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: osi-zookeeper
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: WARN
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - osi-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: osi-kafka
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      - zookeeper
    ports:
      - "127.0.0.1:29092:29092"   # Host access (agent & external tools)
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://osi-kafka:9092,EXTERNAL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168         # 7 hari retention
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # 1 GB max per partition
      KAFKA_MESSAGE_MAX_BYTES: 10485760      # 10 MB max message size
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      # Pre-create enterprise topics dengan partition & replication config
      KAFKA_CREATE_TOPICS: "osi.telemetry:4:1,osi.incidents:2:1,osi.remediation:2:1,osi.knowledge:2:1,osi.governance:1:1,osi.dlq:1:1"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - osi-backend
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: osi-kafka-ui
    restart: always
    security_opt:
      - no-new-privileges:true
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"     # Kafka UI monitoring dashboard
    environment:
      KAFKA_CLUSTERS_0_NAME: "OSI-Enterprise-Cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "osi-kafka:9092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper:2181"
      KAFKA_CLUSTERS_0_READONLY: "${KAFKA_UI_READONLY:-true}"
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: "admin"
      SPRING_SECURITY_USER_PASSWORD: "${KAFKA_UI_PASSWORD:?Set KAFKA_UI_PASSWORD in .env}"
      DYNAMIC_CONFIG_ENABLED: "${KAFKA_UI_DYNAMIC_CONFIG:-false}"
    networks:
      - osi-backend
      - osi-frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  nats_data:
  portainer_data:
  pgadmin_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:

networks:
  osi-frontend:
    driver: bridge
  osi-backend:
    driver: bridge
    internal: false
